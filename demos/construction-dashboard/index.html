<title>建案進度儀表板 · 示範</title>
<style>
  @font-face {
    font-family: 'JetBrains Mono';
    src: local('JetBrains Mono'), local('Consolas'), local('Menlo');
  }

  :root {
    --bg: #eeece5;
    --bg-panel: #ffffff;
    --ink: #23241f;
    --ink-dim: #6b6a5f;
    --line: #d9d6c9;
    --accent: #1f4e6b;
    --accent-soft: #e2ebef;
    --good: #3a7d44;
    --good-soft: #e5f0e3;
    --warn: #b3771c;
    --warn-soft: #f7ecd8;
    --crit: #a83a32;
    --crit-soft: #f6e2df;
    --shadow: 0 1px 2px rgba(35,36,31,0.06), 0 4px 14px rgba(35,36,31,0.05);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c19;
      --bg-panel: #26261f;
      --ink: #e8e6dc;
      --ink-dim: #a3a190;
      --line: #3a3a30;
      --accent: #7fb3d5;
      --accent-soft: #263845;
      --good: #7fbf88;
      --good-soft: #253326;
      --warn: #d9a54a;
      --warn-soft: #3a3021;
      --crit: #e08276;
      --crit-soft: #3a2422;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1c19; --bg-panel: #26261f; --ink: #e8e6dc; --ink-dim: #a3a190;
    --line: #3a3a30; --accent: #7fb3d5; --accent-soft: #263845;
    --good: #7fbf88; --good-soft: #253326; --warn: #d9a54a; --warn-soft: #3a3021;
    --crit: #e08276; --crit-soft: #3a2422;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 14px rgba(0,0,0,0.25);
  }
  :root[data-theme="light"] {
    --bg: #eeece5; --bg-panel: #ffffff; --ink: #23241f; --ink-dim: #6b6a5f;
    --line: #d9d6c9; --accent: #1f4e6b; --accent-soft: #e2ebef;
    --good: #3a7d44; --good-soft: #e5f0e3; --warn: #b3771c; --warn-soft: #f7ecd8;
    --crit: #a83a32; --crit-soft: #f6e2df;
    --shadow: 0 1px 2px rgba(35,36,31,0.06), 0 4px 14px rgba(35,36,31,0.05);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 40px 24px 80px; }

  header.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 18px;
    margin-bottom: 28px;
  }
  .eyebrow {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }
  h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .meta {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    color: var(--ink-dim);
    text-align: right;
  }
  .meta span { display: block; }

  /* upload bar */
  .upload-bar {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 28px;
    box-shadow: var(--shadow);
  }
  .upload-bar .label {
    font-size: 13px;
    color: var(--ink-dim);
  }
  .btn-file {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-file input {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
  }
  .btn-file:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  #fileName { font-size: 13px; color: var(--ink-dim); font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .btn-reset {
    margin-left: auto;
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 12px;
    cursor: pointer;
  }
  .btn-reset:hover { border-color: var(--ink-dim); color: var(--ink); }

  .notice {
    font-size: 12.5px;
    color: var(--ink-dim);
    background: var(--accent-soft);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 28px;
    line-height: 1.6;
  }
  .notice strong { color: var(--ink); }

  /* KPI row */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 32px;
  }
  .kpi {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .kpi .kpi-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    margin-bottom: 8px;
  }
  .kpi .kpi-value {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 28px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }
  .kpi .kpi-sub {
    font-size: 12px;
    color: var(--ink-dim);
    margin-top: 4px;
  }

  section.panel {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
    overflow: hidden;
  }
  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px 12px;
  }
  .panel-head h2 {
    font-size: 15px;
    margin: 0;
    font-weight: 700;
  }
  .panel-head .hint {
    font-size: 11.5px;
    color: var(--ink-dim);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }

  .table-scroll { overflow-x: auto; padding: 0 20px 20px; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-dim);
    border-bottom: 1px solid var(--line);
    padding: 8px 10px;
    font-weight: 600;
  }
  tbody td {
    padding: 11px 10px;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  td.num { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; text-align: right; }

  .bar-cell { display: flex; align-items: center; gap: 10px; min-width: 160px; }
  .bar-track {
    flex: 1;
    height: 8px;
    background: var(--line);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 4px; background: var(--accent); }
  .bar-fill.good { background: var(--good); }
  .bar-fill.warn { background: var(--warn); }
  .bar-fill.crit { background: var(--crit); }
  .bar-pct { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; width: 34px; text-align: right; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 100px;
  }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; }
  .pill.good { background: var(--good-soft); color: var(--good); }
  .pill.good::before { background: var(--good); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.warn::before { background: var(--warn); }
  .pill.crit { background: var(--crit-soft); color: var(--crit); }
  .pill.crit::before { background: var(--crit); }

  footer {
    text-align: center;
    font-size: 11.5px;
    color: var(--ink-dim);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    margin-top: 40px;
  }

  @media (max-width: 720px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    header.top { align-items: flex-start; }
    .meta { text-align: left; }
  }

  @media (prefers-reduced-motion: no-preference) {
    .bar-fill { transition: width 0.5s ease; }
  }
</style>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">工地進度快照 · 靜態儀表板示範</p>
      <h1>建案進度監控儀表板</h1>
    </div>
    <div class="meta">
      <span id="snapTime">快照時間 —</span>
      <span id="siteCount">— 個案場</span>
    </div>
  </header>

  <div class="upload-bar">
    <span class="label">資料來源：</span>
    <label class="btn-file">
      📄 上傳 CSV
      <input type="file" id="csvInput" accept=".csv" />
    </label>
    <span id="fileName">目前顯示：示範資料</span>
    <button class="btn-reset" id="resetBtn">還原示範資料</button>
  </div>

  <div class="notice">
    <strong>這是靜態快照，不是即時系統。</strong>
    畫面上的數字，是你上傳CSV那一刻的資料。重新整理頁面、或關掉分頁再打開，會回到最初的示範資料——因為這份網頁沒有連接任何資料庫，一切運算都只發生在你的瀏覽器裡。
    適合用在週報、月報這種「某個時間點對一份快照」的場景；如果需要多人即時同步更新，就要另外接資料庫和後端服務了。
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <section class="panel">
    <div class="panel-head">
      <h2>各案場進度</h2>
      <span class="hint">依完成率排序</span>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>案場</th>
            <th>階段</th>
            <th>完成進度</th>
            <th style="text-align:right">已售戶數</th>
            <th style="text-align:right">總戶數</th>
            <th>狀態</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </section>

  <footer>vibe coding 課程示範教材 · 純 HTML／JavaScript，無伺服器、無資料庫</footer>
</div>

<script>
  const SAMPLE_CSV = `案名,階段,完成率,已售戶數,總戶數,狀態
翠湖苑,結構體施工,68,142,180,正常
河岸首席,基礎開挖,22,45,220,落後
青田大院,裝修工程,91,98,100,正常
松風雅築,結構體施工,54,60,150,正常
南港雲頂,基礎開挖,12,30,260,落後
瑞光公館,裝修工程,97,88,90,即將完工
文心一號,結構體施工,40,110,300,正常
`;

  const fileInput = document.getElementById('csvInput');
  const fileNameEl = document.getElementById('fileName');
  const resetBtn = document.getElementById('resetBtn');

  function parseCSV(text) {
    // 去掉 UTF-8 BOM（Windows Excel／記事本存檔常見）
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const lines = text.trim().split(/\r?\n/);
    const headers = lines[0].split(',').map(h => h.trim());
    return lines.slice(1).filter(l => l.trim()).map(line => {
      const cells = line.split(',').map(c => c.trim());
      const row = {};
      headers.forEach((h, i) => row[h] = cells[i]);
      return row;
    });
  }

  function statusClass(status, rate) {
    if (status === '落後') return 'crit';
    if (status === '即將完工') return 'good';
    if (rate < 30) return 'crit';
    if (rate < 60) return 'warn';
    return 'good';
  }

  function render(rows) {
    rows = rows.map(r => ({...r, 完成率: Number(r.完成率), 已售戶數: Number(r.已售戶數), 總戶數: Number(r.總戶數)}));
    rows.sort((a, b) => b.完成率 - a.完成率);

    document.getElementById('siteCount').textContent = rows.length + ' 個案場';
    document.getElementById('snapTime').textContent = '快照時間 ' +
      new Date().toLocaleString('zh-TW', {hour12: false});

    // KPIs
    const avg = Math.round(rows.reduce((s, r) => s + r.完成率, 0) / rows.length);
    const behind = rows.filter(r => r.狀態 === '落後').length;
    const totalSold = rows.reduce((s, r) => s + r.已售戶數, 0);
    const totalUnits = rows.reduce((s, r) => s + r.總戶數, 0);

    const kpis = [
      { label: '平均完成率', value: avg + '%', sub: `${rows.length} 個案場平均` },
      { label: '落後案場', value: behind, sub: behind > 0 ? '需要關注' : '無落後案場' },
      { label: '銷售戶數', value: totalSold.toLocaleString(), sub: `／ 總戶數 ${totalUnits.toLocaleString()}` },
      { label: '整體銷售率', value: Math.round(totalSold / totalUnits * 100) + '%', sub: '全案場加總計算' },
    ];
    document.getElementById('kpiRow').innerHTML = kpis.map(k => `
      <div class="kpi">
        <div class="kpi-label">${k.label}</div>
        <div class="kpi-value">${k.value}</div>
        <div class="kpi-sub">${k.sub}</div>
      </div>
    `).join('');

    // Table
    document.getElementById('tbody').innerHTML = rows.map(r => {
      const cls = statusClass(r.狀態, r.完成率);
      return `
        <tr>
          <td>${r.案名}</td>
          <td>${r.階段}</td>
          <td>
            <div class="bar-cell">
              <div class="bar-track"><div class="bar-fill ${cls}" style="width:${r.完成率}%"></div></div>
              <span class="bar-pct">${r.完成率}%</span>
            </div>
          </td>
          <td class="num">${r.已售戶數}</td>
          <td class="num">${r.總戶數}</td>
          <td><span class="pill ${cls}">${r.狀態}</span></td>
        </tr>
      `;
    }).join('');
  }

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const rows = parseCSV(ev.target.result);
        render(rows);
        fileNameEl.textContent = '目前顯示：' + file.name;
      } catch (err) {
        alert('CSV 解析失敗，請確認欄位格式是否正確。');
      }
    };
    reader.readAsText(file, 'UTF-8');
  });

  resetBtn.addEventListener('click', () => {
    fileInput.value = '';
    render(parseCSV(SAMPLE_CSV));
    fileNameEl.textContent = '目前顯示：示範資料';
  });

  render(parseCSV(SAMPLE_CSV));
</script>
